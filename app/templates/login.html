<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{ app_name }} — Staff login</title>
<style>
  :root{--bg:#0f172a;--panel:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--accent:#38bdf8;--border:#334155;--red:#ef4444;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:32px;width:360px;}
  h1{font-size:20px;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:14px;margin:0 0 22px;}
  label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;}
  input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);
    background:var(--bg);color:var(--text);font-size:15px;}
  button{width:100%;margin-top:22px;padding:12px;border:none;border-radius:10px;background:var(--accent);
    color:#08131f;font-size:15px;font-weight:600;cursor:pointer;}
  .err{background:rgba(239,68,68,.12);color:#fca5a5;border:1px solid rgba(239,68,68,.35);
    border-radius:10px;padding:10px 12px;font-size:14px;margin-top:16px;}
</style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <input type="hidden" name="next" value="{{ next or '' }}" />
    <h1>{{ app_name }}</h1>
    <p class="sub">Staff &amp; leadership sign-in</p>
    {% if error %}<div class="err">Wrong username or password.</div>{% endif %}
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" autofocus />
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" />
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
