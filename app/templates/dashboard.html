<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{ app_name }} — Dashboard</title>
<style>
  :root {
    --bg:#0f172a; --panel:#1e293b; --panel-2:#334155; --text:#f1f5f9;
    --muted:#94a3b8; --accent:#38bdf8; --green:#22c55e; --amber:#f59e0b;
    --red:#ef4444; --border:#334155;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  header{padding:20px 28px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  header h1{font-size:22px;font-weight:600;margin:0;}
  .controls{display:flex;gap:12px;align-items:center;}
  input[type=date]{background:var(--panel);color:var(--text);border:1px solid var(--border);
    border-radius:10px;padding:8px 12px;font-size:15px;}
  a.btn,button.btn{background:var(--accent);color:#08131f;border:none;border-radius:10px;
    padding:9px 16px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;}
  a.btn.secondary{background:var(--panel-2);color:var(--text);}
  main{padding:28px;max-width:1000px;margin:0 auto;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:28px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px;}
  .card .num{font-size:38px;font-weight:700;line-height:1;}
  .card .label{color:var(--muted);margin-top:8px;font-size:14px;}
  .card.green .num{color:var(--green);} .card.amber .num{color:var(--amber);}
  .card.red .num{color:var(--red);} .card.accent .num{color:var(--accent);}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:22px;}
  .panel h2{font-size:17px;margin:0 0 16px;font-weight:600;}
  .muted{color:var(--muted);}
</style>
</head>
<body>
<header>
  <h1>{{ app_name }} — Dashboard</h1>
  <div class="controls">
    <input type="date" id="day" value="{{ day }}" />
    <a class="btn" id="reportLink" href="/report/daily?day={{ day }}">Daily report</a>
  </div>
</header>
<main>
  <div class="cards">
    <div class="card accent"><div class="num" id="present">{{ summary.present }}</div><div class="label">Students present today</div></div>
    <div class="card green"><div class="num" id="stillin">{{ summary.still_in }}</div><div class="label">Currently checked in</div></div>
    <div class="card"><div class="num" id="out">{{ summary.checked_out }}</div><div class="label">Checked out</div></div>
    <div class="card amber"><div class="num" id="noemail">{{ summary.missing_email }}</div><div class="label">Missing guardian email</div></div>
  </div>

  <div class="panel">
    <h2>Attendance by program</h2>
    <canvas id="programChart" height="120"></canvas>
    <p class="muted" id="emptyNote" style="display:none;">No check-ins recorded for this day yet.</p>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
let chart = null;
const dayInput = document.getElementById("day");

function render(summary) {
  document.getElementById("present").textContent = summary.present;
  document.getElementById("stillin").textContent = summary.still_in;
  document.getElementById("out").textContent = summary.checked_out;
  document.getElementById("noemail").textContent = summary.missing_email;
  document.getElementById("reportLink").href = "/report/daily?day=" + summary.date;

  const labels = Object.keys(summary.by_program);
  const data = Object.values(summary.by_program);
  document.getElementById("emptyNote").style.display = labels.length ? "none" : "block";

  const ctx = document.getElementById("programChart");
  if (chart) chart.destroy();
  chart = new Chart(ctx, {
    type: "bar",
    data: { labels, datasets: [{ label: "Students present", data, backgroundColor: "#38bdf8", borderRadius: 6 }] },
    options: {
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: "#94a3b8" }, grid: { display: false } },
        y: { ticks: { color: "#94a3b8", precision: 0 }, grid: { color: "#334155" }, beginAtZero: true }
      }
    }
  });
}

async function load() {
  const res = await fetch("/api/dashboard/summary?day=" + dayInput.value);
  render(await res.json());
}

dayInput.addEventListener("change", load);
render({{ summary | tojson }});
setInterval(load, 15000);  // live-ish refresh
</script>
</body>
</html>
