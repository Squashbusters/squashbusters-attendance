name: keep-warm

# Pings the live app so Render's free tier never idles into a cold start.
# Runs every 10 minutes (and can be triggered manually).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York   # log timestamps in Boston time, not UTC
    steps:
      - name: Ping health endpoint
        run: |
          STAMP="$(date '+%m-%d-%Y %I:%M:%S %p %Z')"
          if curl -fsS --max-time 90 https://squashbusters-attendance.onrender.com/health > /dev/null; then
            echo "ping  $STAMP  OK"
          else
            echo "ping  $STAMP  FAILED (app may have been waking up)"
          fi
