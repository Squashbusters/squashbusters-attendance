name: keep-warm

# Pings the live app so Render's free tier never idles into a cold start.
# Runs every 10 minutes (and can be triggered manually).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS --max-time 90 https://squashbusters-attendance.onrender.com/health \
            && echo "pinged OK" || echo "ping failed (app may have been waking up)"
