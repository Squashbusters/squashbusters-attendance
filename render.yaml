# Render Blueprint — deploy with one click from this repo.
# In Render: New → Blueprint → pick this repo. Then set the "sync: false"
# secrets (SMTP_USER/PASSWORD, EMAIL_FROM) in the dashboard.
services:
  - type: web
    name: squashbusters-attendance
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: squashbusters-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: TIME_GUARD_MINUTES
        value: "30"
      - key: EMAIL_BACKEND
        value: smtp
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USE_TLS
        value: "1"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false

databases:
  - name: squashbusters-db
    plan: free
