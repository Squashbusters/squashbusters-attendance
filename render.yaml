# Render Blueprint — one-click deploy for a shareable demo.
# In Render: New → Blueprint → pick this repo → Apply. No secrets to enter.
#
# This demo build uses SQLite + the "file" email backend (emails show in the
# in-app /outbox, none are actually sent) and self-seeds the sample roster on
# startup. To enable real email later, add EMAIL_BACKEND=smtp and the SMTP_*
# vars in the Render dashboard.
services:
  - type: web
    name: squashbusters-attendance
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_ON_STARTUP
        value: "1"
      - key: EMAIL_BACKEND
        value: file
      - key: TIME_GUARD_MINUTES
        value: "30"
